appId: com.mjq.typeflow-ai
productName: TypeFlow AI
# A fixed, lowercase, space-free filename. productName ("TypeFlow AI") is what
# users see in the Start menu and the window title; this is only what the
# downloaded file is called, and a name with no spaces survives being passed
# around shells, URLs and scripts intact.
#
# Deliberately carries no version: the GitHub release tag identifies it. The
# cost is that two downloads collide in a Downloads folder — switch to
# typeflow-ai-${version}.${ext} if that ever bites.
artifactName: typeflow-ai.${ext}
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - "!**/*.map"
  # Migrations are read at startup by drizzle's migrator. They must be in the
  # package, not just the repo. Readable from inside the asar.
  - src/db/migrations/**
asarUnpack:
  # Native .node binaries cannot be loaded from inside an asar archive.
  - "**/*.node"
  - node_modules/better-sqlite3/**
extraResources:
  # The tray and the window icons load this at runtime by path. buildResources
  # is excluded from the app package, and reading an image out of the asar is
  # unreliable, so it is copied out beside the app — see src/main/app-icon.ts.
  - from: build/icon.png
    to: icon.png
win:
  # 1024x1024 with transparency. electron-builder generates the multi-size .ico
  # for the .exe and the installer from it.
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # Per-user, deliberately. Beyond avoiding an admin prompt to install, a
  # per-machine install puts the app in a directory it cannot write, and does
  # nothing to help the UIPI limitation in CLAUDE.md §6.4.
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: TypeFlow AI
  # This is the electron-builder default, but it is stated explicitly because
  # the cost of it ever flipping is the user's entire dictation history and
  # every recording deleted by an uninstall they expected to be reversible.
  deleteAppDataOnUninstall: false
  runAfterFinish: true
