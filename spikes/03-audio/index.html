<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'" />
    <title>Spike 3 — audio capture</title>
    <style>
      :root { color-scheme: light; --accent: #4f46e5; }
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 24px;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        background: #fbfbfd; color: #18181b;
      }
      h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; color: #71717a; font-size: 13px; }
      label { display: block; font-size: 12px; color: #71717a; margin-bottom: 6px; }
      select {
        width: 100%; padding: 8px 10px; border: 1px solid #e4e4e7; border-radius: 8px;
        background: #fff; font: inherit; margin-bottom: 16px;
      }
      button {
        font: inherit; font-weight: 500; padding: 10px 18px; border-radius: 8px;
        border: 1px solid #e4e4e7; background: #fff; cursor: pointer;
      }
      button:hover { background: #f4f4f5; }
      #btn { background: var(--accent); border-color: var(--accent); color: #fff; min-width: 110px; }
      #btn.rec { background: #dc2626; border-color: #dc2626; }
      .row { display: flex; gap: 8px; align-items: center; margin-bottom: 16px; }
      #meter {
        flex: 1; height: 8px; border-radius: 999px; background: #e4e4e7;
        overflow: hidden; position: relative;
      }
      #meter::after {
        content: ''; position: absolute; inset: 0;
        transform: scaleX(var(--level, 0)); transform-origin: left;
        background: var(--accent); transition: transform 60ms linear;
      }
      .stat { font-variant-numeric: tabular-nums; color: #71717a; font-size: 12px; min-width: 62px; }
      #log {
        border-top: 1px solid #e4e4e7; padding-top: 12px; margin-top: 4px;
        max-height: 300px; overflow-y: auto;
        font-family: ui-monospace, Cascadia Code, Consolas, monospace; font-size: 11.5px;
      }
      .line { padding: 3px 0; color: #52525b; border-bottom: 1px solid #f4f4f5; word-break: break-all; }
      .line.ok { color: #15803d; }
      .line.warn { color: #b45309; }
      .line.err { color: #b91c1c; }
    </style>
  </head>
  <body>
    <h1>Spike 3 — 16 kHz mono capture</h1>
    <p class="sub">Record a few seconds of speech, then record silence. Both should behave per §6.6.</p>

    <label for="mic">Input device</label>
    <select id="mic"></select>

    <div class="row">
      <button id="btn">Record</button>
      <div id="meter"></div>
      <span class="stat">peak <span id="peak">0.0000</span></span>
    </div>

    <div class="row">
      <button id="open">Open output folder</button>
    </div>

    <div id="log"></div>

    <script src="./recorder.js" type="module"></script>
  </body>
</html>
